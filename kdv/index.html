<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KDV Hesap Defteri</title>
<meta name="description" content="Ürün ürün KDV hariç / KDV dahil hesap ve proforma. Telefonda ve bilgisayarda çalışır.">
<meta name="theme-color" content="#3B2F2A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="KDV Hesabı">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap">
<style>
/* Düzen: fatura düzenleyicisi gibi — solda tek tablo (satır = ürün), sağda toplam kutusu; telefonda satırlar alt alta, altta toplam şeridi */
:root {
  --bg: #F4EFE8;        /* fildişi */
  --surface: #FFFDF9;
  --sunken: #F1EBE2;
  --ink: #3B2F2A;       /* espresso */
  --muted: #847468;
  --line: #E6DCCF;
  --accent: #B08D57;    /* altın */
  --accent-ink: #85663A;
  --btn-bg: #3B2F2A;
  --btn-fg: #F7F2EA;
  --danger: #A2483A;
  --ok: #56603A;
  --shadow: 0 1px 2px rgba(59,47,42,.05), 0 8px 24px rgba(59,47,42,.06);
  --font-body: "Montserrat", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1C1917; --surface: #26211E; --sunken: #2E2824; --ink: #F1EAE0; --muted: #AB9C8D; --line: #3A322D;
    --accent: #C9A66F; --accent-ink: #D9BA86; --btn-bg: #F1EAE0; --btn-fg: #26211E; --danger: #E3907F; --ok: #BFC49A;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1C1917; --surface: #26211E; --sunken: #2E2824; --ink: #F1EAE0; --muted: #AB9C8D; --line: #3A322D;
  --accent: #C9A66F; --accent-ink: #D9BA86; --btn-bg: #F1EAE0; --btn-fg: #26211E; --danger: #E3907F; --ok: #BFC49A;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25); color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 14px/1.5 var(--font-body); font-variant-numeric: lining-nums tabular-nums; }
button, input, select, textarea { font: inherit; color: inherit; font-variant-numeric: lining-nums tabular-nums; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.wrap { max-width: 1200px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 110px; }
@media (min-width: 900px) { .wrap { padding-inline: 32px; padding-block: 32px 48px; } }

/* Üst satır */
.top { padding-top: env(safe-area-inset-top, 0px); display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 22px; }
.id { display: flex; align-items: center; gap: 14px; min-width: 0; }
.logo { display: block; color: var(--ink); line-height: 0; }
.logo svg { height: 40px; width: auto; display: block; }
h1 { margin: 0; padding-left: 14px; border-left: 1px solid var(--line); font-size: 13px; font-weight: 500; color: var(--muted); line-height: 1.25; white-space: nowrap; }
h1 b { display: block; color: var(--ink); font-weight: 600; font-size: 15px; }
@media (max-width: 400px) { .logo svg { height: 32px; } h1 { padding-left: 10px; } .id { gap: 10px; } }
.top-actions { display: flex; gap: 8px; align-items: center; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 40px; padding: 0 16px;
  border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; font-weight: 500; white-space: nowrap;
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--btn-bg); color: var(--btn-fg); border-color: var(--btn-bg); }
.btn.primary:hover { opacity: .92; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--accent-ink); padding: 0 8px; }
.btn.ghost:hover { background: var(--sunken); }
.btn.icon { width: 40px; padding: 0; }
.btn svg { width: 16px; height: 16px; flex: none; }
.btn.danger { color: var(--danger); }

.layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; align-items: start; }
@media (min-width: 900px) {
  .layout { grid-template-columns: minmax(0, 1fr) 280px; gap: 24px; }
  .totals { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 24px); }
}
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); min-width: 0; }

/* Ürün tablosu */
.t-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.t-head h2 { margin: 0; font-size: 15px; font-weight: 600; }
.seg { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
.seg-box { display: inline-flex; padding: 3px; border-radius: 9px; background: var(--sunken); }
.seg-box button { border: 0; background: transparent; border-radius: 7px; padding: 5px 10px; font-size: 12px; font-weight: 500; color: var(--muted); }
.seg-box button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }

.cols, .li { display: grid; grid-template-columns: minmax(0, 1fr) 64px 116px 76px 116px 32px; column-gap: 8px; align-items: center; }
.profit-on .cols, .profit-on .li { grid-template-columns: minmax(0, 1fr) 58px 106px 72px 100px 112px 32px; }
.cols { padding: 10px 16px 6px; font-size: 10.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.cols .r { text-align: right; padding-right: 9px; }
.cols .tr { text-align: right; }
.cost-col { display: none; }
.profit-on .cost-col { display: block; }

.lines { display: grid; }
.li { padding: 8px 16px; border-top: 1px solid var(--line); row-gap: 2px; }
.li:first-child { border-top-color: transparent; }
.li .ml { display: none; }
.in {
  width: 100%; min-width: 0; height: 38px; border: 1px solid transparent; border-radius: 8px; background: transparent; padding: 0 8px; font-size: 14px;
}
.li:hover .in, .in:focus { border-color: var(--line); }
.in:focus { outline: none; border-color: var(--accent); background: var(--surface); }
.in.n { text-align: right; }
.in.name { font-weight: 500; }
select.in { cursor: pointer; padding-right: 4px; }
.in::placeholder { color: var(--muted); opacity: .75; font-weight: 400; }
.c-total { text-align: right; font-weight: 600; font-size: 14.5px; white-space: nowrap; }
.x { width: 32px; height: 32px; border: 0; background: transparent; color: var(--muted); border-radius: 8px; display: grid; place-items: center; opacity: .55; }
.li:hover .x, .x:focus-visible { opacity: 1; }
.x:hover { color: var(--danger); background: var(--sunken); }
.x svg { width: 16px; height: 16px; }
.c-sub { grid-column: 1 / -2; padding: 0 9px 2px; font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 2px 14px; }
.c-sub b { font-weight: 500; color: var(--ink); }
.c-sub .neg { color: var(--danger); }
.c-sub .pos { color: var(--ok); }
.m-only { display: none; }
.sub-txt { display: contents; }
select.pers {
  height: 26px; border: 1px solid var(--line); border-radius: 999px; background: var(--sunken); color: var(--muted);
  font-size: 12px; font-weight: 500; padding: 0 8px; margin-right: 4px; cursor: pointer; max-width: 100%;
}
select.pers.on { color: var(--accent-ink); border-color: var(--accent); background: var(--surface); }
.c-sub .warn { color: var(--danger); font-weight: 500; }
.pers-panel { border-top: 1px solid var(--line); background: var(--sunken); padding: 12px 16px; display: grid; gap: 8px; }
.pp-head { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.pp-head span { text-transform: none; letter-spacing: 0; font-weight: 500; }
.pp-grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 170px), 1fr)); }
.pp { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
.pp.cost-col { display: none; } .profit-on .pp.cost-col { display: grid; }
.pp-box { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.pp-box:focus-within { border-color: var(--accent); }
.pp-box input { flex: 1; min-width: 0; border: 0; background: transparent; height: 36px; padding: 0 8px; text-align: right; font-size: 14px; }
.pp-box input:focus { outline: none; }
.pp-box i { font-style: normal; font-size: 11px; color: var(--muted); padding-right: 8px; white-space: nowrap; }
.pp-box.need { border-color: var(--danger); }

.t-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 10px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.hint { font-size: 12px; color: var(--muted); padding: 0 8px; }
.hint button { border: 0; background: none; padding: 0; color: var(--accent-ink); font-weight: 600; text-decoration: underline; text-underline-offset: 2px; }

/* Öneri listesi */
.name-wrap { position: relative; min-width: 0; }
.suggest {
  position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 30; max-height: 280px; overflow: auto; min-width: 260px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); padding: 4px;
}
.opt { display: flex; justify-content: space-between; gap: 12px; padding: 8px 10px; border-radius: 7px; cursor: pointer; font-size: 13px; }
.opt[aria-selected="true"], .opt:hover { background: var(--sunken); }
.opt .op { color: var(--muted); white-space: nowrap; }

/* Telefonda satırlar */
@media (max-width: 639px) {
  .cols { display: none; }
  .li, .profit-on .li {
    grid-template-columns: repeat(3, minmax(0, 1fr)) 32px; grid-template-areas: "name name name x" "qty price rate rate" "sub sub sub sub";
    padding: 12px; row-gap: 6px;
  }
  .li:first-child { border-top-color: transparent; }
  .profit-on .li { grid-template-areas: "name name name x" "qty price rate rate" "cost cost cost cost" "sub sub sub sub"; }
  .li .ml { display: block; font-size: 10px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0 0 2px 2px; }
  .c-name { grid-area: name; } .c-qty { grid-area: qty; } .c-price { grid-area: price; } .c-rate { grid-area: rate; } .c-cost { grid-area: cost; }
  .x { grid-area: x; align-self: end; margin-bottom: 5px; opacity: 1; }
  .c-total { display: none; }
  .c-sub { grid-area: sub; padding: 0 2px; }
  .m-only { display: inline; }
  .in { border-color: var(--line); background: var(--bg); height: 42px; }
  .t-head { padding: 12px; }
}

/* Toplam kutusu */
.totals { padding: 18px; display: grid; gap: 14px; }
.totals h2 { margin: 0; font-size: 15px; font-weight: 600; }
.trows { display: grid; gap: 9px; margin: 0; }
.trow { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; }
.trow dt { color: var(--muted); }
.trow dd { margin: 0; font-weight: 500; }
.trow dd.pos { color: var(--ok); } .trow dd.neg { color: var(--danger); }
.grand { border-top: 1px solid var(--line); padding-top: 14px; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.grand span { font-size: 13px; font-weight: 600; white-space: nowrap; }
.grand b { font-size: 22px; white-space: nowrap; font-weight: 600; letter-spacing: -.01em; }
.profit-box { background: var(--sunken); border-radius: 10px; padding: 12px; display: grid; gap: 7px; margin: 0; }
.small { font-size: 11.5px; color: var(--muted); margin: 0; }

/* Telefonda alt şerit */
.dock {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); background: var(--surface); border-top: 1px solid var(--line); box-shadow: 0 -6px 20px rgba(0,0,0,.08);
}
.dock .k { font-size: 11px; color: var(--muted); }
.dock .v { font-size: 19px; font-weight: 600; }
@media (min-width: 900px) { .dock { display: none; } }

/* Menü */
.menu { position: relative; }
.menu-pop {
  position: absolute; right: 0; top: calc(100% + 6px); z-index: 25; min-width: 240px; display: grid; padding: 6px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow);
}
.menu-pop > button { text-align: left; border: 0; background: transparent; border-radius: 8px; padding: 10px 12px; font-size: 13px; font-weight: 500; }
.menu-pop > button:hover { background: var(--sunken); }
.menu-pop hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; width: 100%; }
.menu-pop .danger { color: var(--danger); }
.confirm { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 6px; font-size: 13px; }

/* Pencereler */
dialog.sheet {
  border: 0; padding: 0; background: var(--bg); color: var(--ink); border-radius: 16px; width: min(1080px, calc(100% - 32px)); max-width: none;
  max-height: calc(100% - 32px); box-shadow: 0 24px 70px rgba(0,0,0,.35);
}
dialog.sheet.narrow { width: min(640px, calc(100% - 32px)); }
dialog.sheet[open] { display: flex; flex-direction: column; }
dialog.sheet::backdrop { background: rgba(28, 22, 18, .5); }
@media (max-width: 640px) { dialog.sheet, dialog.sheet.narrow { width: 100%; height: 100%; max-height: 100%; margin: 0; border-radius: 0; } }
.d-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: calc(14px + env(safe-area-inset-top, 0px)) 18px 14px; border-bottom: 1px solid var(--line); }
.d-head h2 { margin: 0; font-size: 17px; font-weight: 600; }
.d-head .x { opacity: 1; }
.d-body { flex: 1; min-height: 0; overflow: auto; padding: 18px; }
.d-foot { display: flex; gap: 8px; justify-content: flex-end; align-items: center; flex-wrap: wrap; padding: 12px 18px calc(12px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); }
.d-foot .grow { flex: 1; font-size: 12px; color: var(--muted); min-width: 140px; }
.field { display: grid; gap: 5px; min-width: 0; }
.field > span { font-size: 12px; font-weight: 500; color: var(--muted); }
.field input, .field textarea {
  width: 100%; border: 1px solid var(--line); border-radius: 9px; background: var(--surface); padding: 10px 11px; font-size: 14px; min-width: 0;
}
.field textarea { resize: vertical; min-height: 64px; line-height: 1.45; }
.field input:focus, .field textarea:focus { outline: none; border-color: var(--accent); }
.form { display: grid; gap: 14px; align-content: start; }
.form .two { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr)); }
details.more { border-top: 1px solid var(--line); padding-top: 10px; }
details.more summary { cursor: pointer; font-size: 13px; font-weight: 600; color: var(--accent-ink); padding: 4px 0; }
details.more[open] summary { margin-bottom: 12px; }
details.more .form { padding-bottom: 6px; }

.q-layout { display: grid; gap: 20px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 940px) { .q-layout { grid-template-columns: 320px minmax(0, 1fr); align-items: start; } .q-preview { position: sticky; top: 0; } }
.a4-frame { overflow: hidden; border-radius: 6px; border: 1px solid var(--line); box-shadow: var(--shadow); background: #fff; }
.a4-scale { width: 794px; transform-origin: top left; }

/* Kâğıt: her temada beyaz sayfa */
.a4 {
  --p-ink: #2A2826; --p-muted: #7A6C61; --p-line: #E7DED2; --p-gold: #9A7944; --p-band: #F7F2EB;
  width: 794px; min-height: 1123px; background: #FFFFFF; color: var(--p-ink); padding: 60px 64px 52px;
  font: 400 12px/1.5 var(--font-body); font-variant-numeric: lining-nums tabular-nums; display: flex; flex-direction: column; gap: 30px;
}
.a4 .q-top { display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; padding-bottom: 18px; border-bottom: 2px solid var(--p-ink); }
.a4 .mark { color: #1E1B19; line-height: 0; }
.a4 .mark svg, .a4 .mark img { height: 62px; width: auto; display: block; }
.a4 .q-title { text-align: right; }
.a4 .q-title h3 { margin: 0 0 10px; font-size: 26px; font-weight: 700; letter-spacing: .32em; margin-right: -.32em; }
.a4 .meta { display: grid; grid-template-columns: auto auto; gap: 3px 14px; justify-content: end; font-size: 11px; }
.a4 .meta span:nth-child(odd) { color: var(--p-muted); text-align: right; }
.a4 .lab { font-size: 8.5px; font-weight: 700; letter-spacing: .22em; text-transform: uppercase; color: var(--p-gold); margin-bottom: 6px; }
.a4 .parties { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.a4 .party { border: 1px solid var(--p-line); border-radius: 6px; padding: 14px 16px; }
.a4 .party .nm { font-size: 14px; font-weight: 600; }
.a4 .party .dt { color: var(--p-muted); white-space: pre-line; font-size: 10.5px; line-height: 1.6; margin-top: 3px; }
.a4 table { width: 100%; border-collapse: collapse; }
.a4 th { font-size: 8.5px; font-weight: 700; letter-spacing: .14em; color: var(--p-ink); text-align: right; padding: 9px 8px; background: var(--p-band); }
.a4 td { padding: 10px 8px; text-align: right; border-bottom: 1px solid var(--p-line); vertical-align: top; }
.a4 th:nth-child(2), .a4 td:nth-child(2) { text-align: left; }
.a4 th:first-child, .a4 td:first-child { width: 26px; text-align: left; color: var(--p-muted); }
.a4 td .sku { color: var(--p-muted); font-size: 9.5px; margin-top: 1px; }
.a4 tr.ext td { padding-top: 0; color: var(--p-muted); font-size: 11px; }
.a4 tr.has-ext td { border-bottom: 0; }
.a4 td:nth-child(2), .a4 .words, .a4 .terms, .a4 .foot { font-variant-numeric: normal; } /* PDF aracı eşit genişlikli rakamlarda kelime aralığını kaydırıyor */
.a4 tr { break-inside: avoid; }
.a4 .q-bottom { display: grid; grid-template-columns: minmax(0, 1fr) 270px; gap: 28px; align-items: start; }
.a4 .terms { display: grid; gap: 14px; font-size: 11px; }
.a4 .terms dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; }
.a4 .terms dt { color: var(--p-muted); } .a4 .terms dd { margin: 0; white-space: pre-line; }
.a4 .bank { background: var(--p-band); border-radius: 6px; padding: 12px 14px; }
.a4 .bank dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; }
.a4 .bank dt { color: var(--p-muted); } .a4 .bank dd { margin: 0; font-weight: 600; }
.a4 .tot > div { display: flex; justify-content: space-between; gap: 12px; padding: 5px 0; }
.a4 .tot .s { color: var(--p-muted); font-size: 11px; }
.a4 .tot .g { margin-top: 8px; padding: 12px 14px; background: #1E1B19; color: #FFFFFF; border-radius: 4px; font-size: 15px; font-weight: 700; }
.a4 .words { margin-top: 8px; font-size: 10px; font-style: italic; color: var(--p-muted); }
.a4 .foot { margin-top: auto; display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; padding-top: 16px; border-top: 1px solid var(--p-line); color: var(--p-muted); font-size: 9.5px; line-height: 1.6; }
.a4 .foot .sign { width: 200px; text-align: center; }
.a4 .foot .sign .line { border-top: 1px solid var(--p-ink); padding-top: 6px; color: var(--p-ink); font-size: 11px; font-weight: 600; margin-top: 46px; }

/* Ürün listesi (katalog) */
.c-tools { margin-bottom: 12px; }
.c-list { display: grid; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); overflow: hidden; }
.c-row { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 10px; align-items: center; padding: 10px 12px; border-top: 1px solid var(--line); }
.c-row:first-child { border-top: 0; }
.c-row .cn { font-weight: 500; overflow-wrap: anywhere; }
.c-row .cm { font-size: 12px; color: var(--muted); }
.c-row .cost { width: 104px; }
.c-row .cost input { width: 100%; height: 34px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); padding: 0 8px; text-align: right; font-size: 13px; }
.c-row .cost input:focus { outline: none; border-color: var(--accent); }
.c-empty { padding: 28px 16px; text-align: center; color: var(--muted); }
.c-empty b { display: block; color: var(--ink); font-size: 15px; margin-bottom: 4px; }

.toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(80px + env(safe-area-inset-bottom, 0px)); z-index: 40;

<script>
(() => {
  "use strict";
  const KEY = "faravis-kdv-v1", KEY_CAT = "faravis-kdv-katalog", KEY_SET = "faravis-kdv-ayarlar";
  const RATES = [0, 1, 10, 20];
  const LIB_PDF = "https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js";
  const LIB_XLSX = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";

  // claude.ai içinde açıldıysa dosyalar "downloads" izniyle kaydedilir
  let embedded = false;
  try { embedded = window.self !== window.top; } catch (e) { embedded = true; }

  const $ = (s, r = document) => r.querySelector(s);
  const money = new Intl.NumberFormat("tr-TR", { style: "currency", currency: "TRY", minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const plain = new Intl.NumberFormat("tr-TR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const nf = new Intl.NumberFormat("tr-TR", { maximumFractionDigits: 3 });
  const pf = new Intl.NumberFormat("tr-TR", { maximumFractionDigits: 1 });
  const fm = (k) => money.format(k / 100);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const norm = (s) => String(s ?? "").toLocaleLowerCase("tr-TR").replace(/\s+/g, " ").trim();
  const today = () => new Date().toLocaleDateString("tr-TR");

  // "1.234,56" · "1234,56" · "1234.56" · "1.500" · "450.00 TRY"
  function parseNum(v) {
    if (typeof v === "number") return v;
    let s = String(v ?? "").replace(/[^\d.,-]/g, "");
    if (!s) return NaN;
    if (s.includes(",")) s = s.replace(/\./g, "").replace(",", ".");
    else if ((s.match(/\./g) || []).length > 1 || /^[1-9]\d{0,2}\.\d{3}$/.test(s)) s = s.replace(/\./g, "");
    const n = Number(s);
    return Number.isFinite(n) ? n : NaN;
  }
  const num0 = (v) => { const n = parseNum(v); return Number.isFinite(n) ? n : 0; };
  const toK = (x) => Math.round((x + Math.sign(x) * 1e-9) * 100); // kuruş

  // ---------- Durum ----------
  let uid = 0;
  const rid = () => "i" + Date.now().toString(36) + (uid++).toString(36);
  const read = (k) => { try { const r = localStorage.getItem(k); return r ? JSON.parse(r) : null; } catch (e) { return null; } };
  const write = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
  const newItem = (o = {}) => ({ id: rid(), name: "", sku: "", price: "", qty: "1", rate: "20", cost: "", ...o });
  const SAMPLE = () => [
    newItem({ name: "Ceviz askı 100 adet (örnek)", price: "4.500,00", qty: "2", cost: "2.600,00" }),
    newItem({ name: "Beyaz pantolon askısı 100 adet (örnek)", price: "3.900,00", qty: "1" }),
  ];

  function migrate(s) {
    if (!s || !Array.isArray(s.items)) return { v: 2, mode: "net", items: SAMPLE(), sample: true, quote: {} };
    if (s.v === 2) return s;
    // Eski sürüm: her satırın kendi fiyat türü ve iskontosu vardı → tek fiyat türüne çevir
    const gross = s.items.filter((x) => x.mode === "gross").length;
    const mode = gross > s.items.length / 2 ? "gross" : "net";
    const items = s.items.map((x) => {
      const r = num0(x.rate) / 100, d = Math.min(100, num0(x.disc)) / 100;
      let p = parseNum(x.price);
      if (Number.isFinite(p)) {
        p *= 1 - d;
        if ((x.mode || "net") !== mode) p = mode === "gross" ? p * (1 + r) : p / (1 + r);
      }
      return newItem({ name: x.name || "", sku: x.sku || "", price: Number.isFinite(p) ? plain.format(p) : "", qty: x.qty || "1", rate: String(x.rate ?? 20), cost: x.cost || "" });
    });
    return { v: 2, mode, items: items.length ? items : [newItem()], sample: !!s.sample, quote: s.quote || {} };
  }
  let state = migrate(read(KEY));
  state.quote = state.quote || {};
  const settings = Object.assign({ profit: false, seq: 1 }, read(KEY_SET) || {});
  if ("showProfit" in settings) { settings.profit = false; delete settings.showProfit; }
  settings.seller = Object.assign({ name: "Faravis Atelier", owner: "", address: "", phone: "", email: "", web: "faravisatelier.com", tax: "", holder: "", bank: "", iban: "" }, settings.seller || {});
  // Logo uygulaması: adet başı fiyat ve maliyet (fiyat, tablodaki fiyat türüyle aynı: KDV hariç ya da dahil)
  const PERS = { lazer: "Lazer kazıma", plaka: "Metal plaka" };
  settings.pers = Object.assign({ lazer: { price: "", cost: "" }, plaka: { price: "", cost: "" } }, settings.pers || {});
  let catalog = read(KEY_CAT);
  if (!catalog || !Array.isArray(catalog.items)) catalog = { items: [], source: "", updated: "" };

  let saveTimer;
  const flush = () => { clearTimeout(saveTimer); saveTimer = null; write(KEY, state); };
  const save = () => { clearTimeout(saveTimer); saveTimer = setTimeout(flush, 150); };
  const saveSettings = () => write(KEY_SET, settings);
  const saveCatalog = () => write(KEY_CAT, catalog);
  addEventListener("pagehide", () => saveTimer && flush());
  document.addEventListener("visibilitychange", () => { if (document.hidden && saveTimer) flush(); });

  // ---------- Hesap (faturadaki gibi satır bazında kuruşa yuvarlanır) ----------
  function calc(it) {
    const p = Math.max(0, num0(it.price)), q = Math.max(0, num0(it.qty));
    const r = Math.min(100, Math.max(0, num0(it.rate))) / 100;
    let net, gross;
    if (state.mode === "gross") { gross = toK(p * q); net = toK(gross / 100 / (1 + r)); }
    else { net = toK(p * q); gross = net + toK((net / 100) * r); }
    const unitNet = toK(state.mode === "gross" ? p / (1 + r) : p);
    const cs = String(it.cost ?? "").trim(), c = parseNum(cs);
    let cost = cs && Number.isFinite(c) ? toK(c * q) : null;
    // Logo uygulaması (lazer kazıma / metal plaka): ürünle aynı adet ve KDV oranı
    let ext = null;
    if (PERS[it.pers]) {
      const pp = settings.pers[it.pers], ep = Math.max(0, num0(pp.price));
      let en, eg;
      if (state.mode === "gross") { eg = toK(ep * q); en = toK(eg / 100 / (1 + r)); }
      else { en = toK(ep * q); eg = en + toK((en / 100) * r); }
      const ecs = String(pp.cost ?? "").trim(), ec = parseNum(ecs);
      ext = { key: it.pers, label: PERS[it.pers], unitNet: toK(state.mode === "gross" ? ep / (1 + r) : ep), net: en, vat: eg - en, gross: eg, missing: !String(pp.price).trim() };
      if (cost !== null && ecs && Number.isFinite(ec)) cost += toK(ec * q);
    }
    const tNet = net + (ext ? ext.net : 0), tGross = gross + (ext ? ext.gross : 0);
    return { net: tNet, vat: tGross - tNet, gross: tGross, p: { net, vat: gross - net, gross }, ext, unitNet, q, rate: r * 100, cost, profit: cost === null ? null : tNet - cost };
  }
  function totals() {
    const t = { net: 0, vat: 0, gross: 0, qty: 0, cost: 0, costNet: 0, costLines: 0, byRate: new Map(), lines: [] };
    state.items.forEach((it) => {
      const c = calc(it);
      t.lines.push({ it, c });
      t.net += c.net; t.vat += c.vat; t.gross += c.gross; t.qty += c.q;
      if (c.cost !== null) { t.cost += c.cost; t.costNet += c.net; t.costLines++; }
      const b = t.byRate.get(c.rate) || { base: 0, vat: 0 }; b.base += c.net; b.vat += c.vat; t.byRate.set(c.rate, b);
    });
    t.rates = [...t.byRate.entries()].sort((a, b) => a[0] - b[0]);
    return t;
  }

  // ---------- Tablo ----------
  const linesEl = $("#lines");
  const X = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>';
  function rowHTML(it) {
    const id = it.id, r = num0(it.rate);
    const opts = (RATES.includes(r) ? RATES : [...RATES, r].sort((a, b) => a - b)).map((v) => `<option value="${v}"${v === r ? " selected" : ""}>%${nf.format(v)}</option>`).join("");
    return `<div class="li" data-id="${id}">
      <div class="c-name"><label class="ml" for="n-${id}">Ürün</label><div class="name-wrap">
        <input class="in name" id="n-${id}" data-f="name" value="${esc(it.name)}" placeholder="Ürün adı" autocomplete="off" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="s-${id}">
        <div class="suggest" id="s-${id}" role="listbox" hidden></div></div></div>
      <div class="c-qty"><label class="ml" for="q-${id}">Adet</label><input class="in n" id="q-${id}" data-f="qty" inputmode="decimal" value="${esc(it.qty)}" aria-label="Adet"></div>
      <div class="c-price"><label class="ml" for="p-${id}">Birim fiyat</label><input class="in n" id="p-${id}" data-f="price" inputmode="decimal" value="${esc(it.price)}" placeholder="0,00" aria-label="Birim fiyat"></div>
      <div class="c-rate"><label class="ml" for="r-${id}">KDV</label><select class="in" id="r-${id}" data-f="rate" aria-label="KDV oranı">${opts}</select></div>
      <div class="c-cost cost-col"><label class="ml" for="c-${id}">Birim maliyet (KDV hariç)</label><input class="in n" id="c-${id}" data-f="cost" inputmode="decimal" value="${esc(it.cost)}" placeholder="—" aria-label="Birim maliyet (KDV hariç)"></div>
      <div class="c-total" data-out="tot"></div>
      <button class="x" type="button" data-act="del" aria-label="Satırı sil">${X}</button>
      <div class="c-sub"><select class="pers${PERS[it.pers] ? " on" : ""}" id="x-${id}" data-f="pers" aria-label="Logo uygulaması">
        <option value="">Logo uygulaması yok</option>${Object.entries(PERS).map(([k, v]) => `<option value="${k}"${it.pers === k ? " selected" : ""}>+ ${v}</option>`).join("")}
      </select><span class="sub-txt" data-out="sub"></span></div>
    </div>`;
  }
  function renderAll(focusId) {
    linesEl.innerHTML = state.items.map(rowHTML).join("");
    state.items.forEach(updateRow);
    updateTotals();
    document.querySelectorAll("[data-mode]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.mode === state.mode)));
    $("#table").classList.toggle("profit-on", settings.profit);
    $("#hint").innerHTML = state.sample ? `Örnek satırlar · <button type="button" id="btnFresh">Temizle</button>` : "";
    renderPers();
    if (focusId) document.getElementById("n-" + focusId)?.focus();
  }
  function updateRow(it) {
    const el = linesEl.querySelector(`[data-id="${it.id}"]`); if (!el) return;
    const c = calc(it);
    el.querySelector('[data-out="tot"]').textContent = fm(c.gross);
    let sub = `<span>KDV hariç <b>${fm(c.net)}</b></span><span>KDV <b>${fm(c.vat)}</b></span><span class="m-only">KDV dahil <b>${fm(c.gross)}</b></span>`;
    if (c.ext) sub = (c.ext.missing ? `<span class="warn">${c.ext.label} adet fiyatını aşağıya girin</span>` : `<span>${c.ext.label} <b>${fm(c.ext.net)}</b></span>`) + sub;
    el.querySelector("select.pers").classList.toggle("on", !!c.ext);
    if (settings.profit && c.profit !== null) {
      const m = c.net ? (c.profit / c.net) * 100 : 0;
      sub += `<span>${c.profit < 0 ? "Zarar" : "Kâr"} <b class="${c.profit < 0 ? "neg" : "pos"}">${fm(c.profit)}</b> · %${pf.format(m)}</span>`;
    }
    el.querySelector('[data-out="sub"]').innerHTML = sub;
  }
  const trow = (k, v, cls = "") => `<div class="trow"><dt>${k}</dt><dd class="${cls}">${v}</dd></div>`;
  function updateTotals() {
    const t = totals();
    let h = trow("Ara toplam (KDV hariç)", fm(t.net));
    t.rates.forEach(([r, b]) => { h += trow(`KDV %${nf.format(r)}`, fm(b.vat)); });
    $("#trows").innerHTML = h;
    $("#grand").textContent = fm(t.gross);
    $("#dockGrand").textContent = fm(t.gross);
    const pb = $("#profitBox");
    pb.hidden = !settings.profit;
    if (settings.profit) {
      if (!t.costLines) pb.innerHTML = `<p class="small">Kârı görmek için satırlara birim maliyet (KDV hariç) yazın.</p>`;
      else {
        const p = t.costNet - t.cost;
        pb.innerHTML = trow("Maliyet", fm(t.cost)) + trow(p < 0 ? "Zarar" : "Kâr", fm(p), p < 0 ? "neg" : "pos") +
          trow("Marj", "%" + pf.format(t.costNet ? (p / t.costNet) * 100 : 0)) +
          (t.costLines < state.items.length ? `<p class="small">${state.items.length} satırdan ${t.costLines} tanesinin maliyeti var.</p>` : "");
      }
    }
    if ($("#dlgQuote").open) renderQuote();
  }

  // ---------- Bildirim ----------
  let toastTimer, undoFn = null;
  function toast(msg, undo) {
    $("#toastMsg").textContent = msg; undoFn = undo || null; $("#toastAct").hidden = !undo; $("#toast").hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => { $("#toast").hidden = true; undoFn = null; }, undo ? 6000 : 2600);
  }
  $("#toastAct").addEventListener("click", () => { undoFn?.(); $("#toast").hidden = true; undoFn = null; });

  // ---------- Tablo olayları ----------
  const touched = () => { if (state.sample) { state.sample = false; $("#hint").innerHTML = ""; } save(); };
  const itemOf = (el) => { const r = el.closest(".li"); return r && state.items.find((x) => x.id === r.dataset.id); };
  function onField(e) {
    const f = e.target.dataset.f; if (!f) return;
    const it = itemOf(e.target); if (!it) return;
    it[f] = e.target.value;
    if (f === "name") { it.sku = ""; openSuggest(e.target, it); }
    updateRow(it); updateTotals(); touched();
    if (f === "pers") renderPers();
  }
  linesEl.addEventListener("input", (e) => { if (e.target.tagName !== "SELECT") onField(e); });
  linesEl.addEventListener("change", (e) => { if (e.target.tagName === "SELECT") onField(e); });
  linesEl.addEventListener("focusout", (e) => {
    const f = e.target.dataset.f;
    if (f === "name") { setTimeout(() => closeSuggest(e.target), 120); return; }
    if (f !== "price" && f !== "cost") return;
    const it = itemOf(e.target), n = parseNum(e.target.value);
    if (it && e.target.value.trim() && Number.isFinite(n)) { it[f] = e.target.value = plain.format(n); save(); }
  });
  linesEl.addEventListener("keydown", (e) => {
    const f = e.target.dataset.f; if (!f) return;
    if (f === "name" && suggestKey(e)) return;
    if (e.key !== "Enter") return;
    e.preventDefault();
    const it = itemOf(e.target);
    const next = { name: "q", qty: "p", price: settings.profit ? "c" : null }[f];
    if (next) document.getElementById(`${next}-${it.id}`)?.select();
    else if (state.items[state.items.length - 1] === it) addItem();
    else document.getElementById("n-" + state.items[state.items.indexOf(it) + 1].id)?.focus();
  });
  linesEl.addEventListener("mousedown", (e) => { if (e.target.closest(".opt")) e.preventDefault(); });
  linesEl.addEventListener("click", (e) => {
    const opt = e.target.closest(".opt");
    if (opt) { const it = itemOf(opt), c = catalog.items.find((x) => x.id === opt.dataset.cat); if (it && c) pick(it, c); return; }
    if (!e.target.closest('[data-act="del"]')) return;
    const it = itemOf(e.target), i = state.items.indexOf(it), prev = state.items.slice();
    state.items.splice(i, 1);
    if (!state.items.length) state.items.push(newItem());

    toast("Satır silindi", () => { state.items = prev; save(); renderAll(); });
  });
  document.addEventListener("click", (e) => {
    if (e.target.id !== "btnFresh") return;
    const prev = state.items; state.items = [newItem()]; state.sample = false; save(); renderAll(state.items[0].id);
    toast("Örnekler silindi", () => { state.items = prev; state.sample = true; save(); renderAll(); });
  });

  function addItem() {
    const last = state.items[state.items.length - 1];
    const it = newItem({ rate: last ? last.rate : "20" });
    state.items.push(it); touched(); renderAll(it.id);
  }
  $("#btnAdd").addEventListener("click", addItem);

  // Logo uygulaması fiyatları
  function renderPers() {
    $("#ppMode").textContent = state.mode === "gross" ? "(KDV dahil)" : "(KDV hariç)";
    document.querySelectorAll("[data-pp]").forEach((el) => {
      const [k, f] = el.dataset.pp.split(".");
      if (document.activeElement !== el) el.value = settings.pers[k][f] ?? "";
      if (f === "price") el.parentElement.classList.toggle("need", !String(settings.pers[k].price).trim() && state.items.some((x) => x.pers === k));
    });
  }
  $("#persPanel").addEventListener("input", (e) => {
    const el = e.target; if (!el.dataset.pp) return;
    const [k, f] = el.dataset.pp.split("."); settings.pers[k][f] = el.value; saveSettings();
    state.items.forEach(updateRow); updateTotals(); renderPers();
  });
  $("#persPanel").addEventListener("focusout", (e) => {
    const el = e.target; if (!el.dataset.pp) return;
    const [k, f] = el.dataset.pp.split("."), n = parseNum(el.value);
    if (el.value.trim() && Number.isFinite(n)) { settings.pers[k][f] = el.value = plain.format(n); saveSettings(); }
  });

  // Fiyat türü tüm tablo için tek ayar. Değiştirince fiyatlar çevrilir, toplamlar aynı kalır.
  document.querySelectorAll("[data-mode]").forEach((b) => b.addEventListener("click", () => {
    const m = b.dataset.mode; if (m === state.mode) return;
    state.items.forEach((it) => {
      const p = parseNum(it.price), r = num0(it.rate) / 100;
      if (Number.isFinite(p) && String(it.price).trim()) it.price = plain.format(m === "gross" ? p * (1 + r) : p / (1 + r));
    });
    // Logo uygulaması fiyatları %20 KDV ile çevrilir (askı ve baskı için standart oran)
    Object.values(settings.pers).forEach((pp) => { const p = parseNum(pp.price); if (Number.isFinite(p) && String(pp.price).trim()) pp.price = plain.format(m === "gross" ? p * 1.2 : p / 1.2); });
    saveSettings();
    state.mode = m; touched(); renderAll();
  }));

  // ---------- Ürün listesinden öneri ----------
  let sel = -1;
  const findCat = (q) => { const w = norm(q).split(" ").filter(Boolean); return catalog.items.filter((c) => { const h = norm(c.name + " " + (c.sku || "")); return w.every((x) => h.includes(x)); }); };
  const catPrice = (c) => { const r = (c.rate ?? 20) / 100, p = c.price || 0, m = c.mode || "gross"; return m === state.mode ? p : (state.mode === "gross" ? p * (1 + r) : p / (1 + r)); };
  function openSuggest(input, it) {
    const box = document.getElementById("s-" + it.id);
    if (!box || !catalog.items.length || !input.value.trim()) { closeSuggest(input); return; }
    const list = findCat(input.value).slice(0, 8);
    if (!list.length) { closeSuggest(input); return; }
    sel = -1;
    box.innerHTML = list.map((c) => `<div class="opt" role="option" id="o-${it.id}-${c.id}" data-cat="${c.id}" aria-selected="false"><span>${esc(c.name)}</span><span class="op">${c.price ? fm(toK(catPrice(c))) : ""}</span></div>`).join("");

  }

  }

    if (e.key === "Escape") { closeSuggest(e.target); return true; }
    return false;
  }
  function pick(it, c) {

    touched(); renderAll(); document.getElementById("q-" + it.id)?.select();
  }

  // ---------- Menü ----------
  const pop = $("#morePop"), btnMore = $("#btnMore");
  const menuHTML = () => `<button type="button" data-m="cat">Ürün listesi${catalog.items.length ? ` (${catalog.items.length})` : ""}</button>
      <button type="button" data-m="profit">${settings.profit ? "Kâr hesabını gizle" : "Kâr hesabını göster"}</button>
      <hr><button type="button" data-m="copy">Özeti kopyala</button>
      <button type="button" data-m="csv">Excel'e aktar (CSV)</button>
      <hr><button type="button" data-m="new" class="danger">Yeni liste</button>`;
  const setMenu = (open) => { pop.hidden = !open; btnMore.setAttribute("aria-expanded", String(open)); if (open) pop.innerHTML = menuHTML(); };
  btnMore.addEventListener("click", () => setMenu(pop.hidden));
  document.addEventListener("click", (e) => { if (!pop.hidden && !e.target.closest(".menu")) setMenu(false); });
  pop.addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    const m = b.dataset.m;
    if (m === "cat") { setMenu(false); openCatalog(); }
    else if (m === "profit") { settings.profit = !settings.profit; saveSettings(); setMenu(false); renderAll(); }
    else if (m === "copy") { setMenu(false); copyText(summaryText()); }
    else if (m === "csv") { setMenu(false); exportCsv(); }
    else if (m === "new") pop.innerHTML = `<div class="confirm">Liste silinsin mi? <button class="btn danger" type="button" data-m="yes">Sil</button><button class="btn" type="button" data-m="no">Vazgeç</button></div>`;
    else if (m === "yes") {
      const prev = state; state = { v: 2, mode: state.mode, items: [newItem()], quote: {} }; save(); setMenu(false); renderAll(state.items[0].id);
      toast("Yeni liste açıldı", () => { state = prev; save(); renderAll(); });
    } else if (m === "no") setMenu(false);
  });

  function summaryText() {
    const t = totals(), L = [`KDV hesabı · ${today()}`, ""];
    t.lines.forEach(({ it, c }, i) => {
      L.push(`${i + 1}) ${it.name || "Ürün"} — ${nf.format(c.q)} × ${fm(c.unitNet)} + KDV %${nf.format(c.rate)} = ${fm(c.p.gross)}`);
      if (c.ext) L.push(`   + ${c.ext.label} — ${nf.format(c.q)} × ${fm(c.ext.unitNet)} + KDV = ${fm(c.ext.gross)}`);
    });
    L.push("", `Ara toplam (KDV hariç): ${fm(t.net)}`);
    t.rates.forEach(([r, b]) => L.push(`KDV %${nf.format(r)}: ${fm(b.vat)}`));
    L.push(`Genel toplam (KDV dahil): ${fm(t.gross)}`);

  }
  async function copyText(text) {
    try { await navigator.clipboard.writeText(text); toast("Özet kopyalandı"); }
    catch (e) {
      const ta = document.createElement("textarea"); ta.value = text; ta.style.cssText = "position:fixed;opacity:0"; document.body.appendChild(ta); ta.select();
      let ok = false; try { ok = document.execCommand("copy"); } catch (_) {} ta.remove();
      toast(ok ? "Özet kopyalandı" : "Kopyalanamadı");
    }
  }
  async function saveFile(name, blob) {
    if (embedded) {
      const dl = window.claude?.use ? await window.claude.use("downloads") : null;
      if (!dl) { toast("Bu görünümde dosya indirilemiyor"); return; }

  function fieldOf(h) {

    if (/^(isim|ad|adı|ürün adı|urun adi|name|title|başlık|ürün)$/.test(k)) return "name";
    if (/^varyant değer|^variant value|^seçenek/.test(k)) return "variant";
    if (/^(url|link)$/.test(k)) return "url";
    return null;
  }

    const rows = []; let row = [], cell = "", q = false;
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];

      else if (ch === '"') q = true; else if (ch === d) { row.push(cell); cell = ""; }

  async function loadSite(silent) {
    try {
      const r = await fetch("katalog.json", { cache: "no-cache" }); if (!r.ok) throw 0;
      const j = await r.json(); if (!j.items?.length) throw 0;
      merge(j.items, j.source || "faravisatelier.com", silent);
      if (j.updated) { catalog.updated = j.updated; saveCatalog(); }
    } catch (e) { if (!silent) $("#catStatus").textContent = "Site listesi henüz hazır değil. Şimdilik ikas'tan aldığınız Excel/CSV dosyasını yükleyebilirsiniz."; }
  }
  $("#btnSite").addEventListener("click", () => loadSite(false));

  renderAll();
  if (!catalog.items.length) loadSite(true);
  if (!embedded && "serviceWorker" in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
</body>
</html>
